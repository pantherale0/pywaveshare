[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pywaveshare"
dynamic = ["version"]
description = "Asynchronous Python library and serial proxy transport for Waveshare network RS232/RS485/RS422 adapters"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
authors = [
    { name = "pantherale0" },
]
urls = { Homepage = "https://github.com/pantherale0/pywaveshare", Repository = "https://github.com/pantherale0/pywaveshare", Issues = "https://github.com/pantherale0/pywaveshare/issues" }
keywords = ["waveshare", "serial", "rs485", "rs232", "rfc2217", "serialx", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
serialx = [
    "serialx>=0.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "serialx>=0.4.0",
]

[tool.hatch.version]
path = "pywaveshare/__init__.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["pywaveshare"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["pywaveshare", "tests", "scripts"]
extend-exclude = [
    "*.md",
    "CHANGELOG.md",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["pywaveshare", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
