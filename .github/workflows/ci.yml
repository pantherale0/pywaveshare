name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff
        run: |
          uv run ruff check pywaveshare tests scripts
          uv run ruff format --check pywaveshare tests scripts

      - name: Mypy
        run: uv run mypy pywaveshare

  test:
    runs-on: ubuntu-latest
    # id-token needed for Codecov OIDC when CODECOV_TOKEN is unset.
    # Protected branches reject tokenless uploads ("Token required because branch is protected").
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: >
          uv run pytest
          --cov=pywaveshare
          --cov-report=xml
          --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: true
          name: python-${{ matrix.python-version }}
          # Protected branches require auth: set repo secret CODECOV_TOKEN, or rely on
          # OIDC via the Codecov GitHub App (used automatically when the token is unset).
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
